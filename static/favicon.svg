<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="the room">
	<!--
		The room, not a logo. Nine tiles on the app's own ground colour, four of
		them lit — the front page's shape at 16px, which is the only size this
		is ever read at. No wordmark and no company name on purpose: this repo
		carries neither (see CLAUDE.md), and the brand is a deploy value.
		Colours are app.css's --ground-deep / --gold / --line-strong verbatim.
	-->
	<rect width="64" height="64" rx="12" fill="#0a1020"/>
	<g fill="#c9a05a">
		<rect x="12" y="12" width="12" height="12" rx="2.5"/>
		<rect x="40" y="12" width="12" height="12" rx="2.5"/>
		<rect x="26" y="26" width="12" height="12" rx="2.5"/>
		<rect x="12" y="40" width="12" height="12" rx="2.5"/>
	</g>
	<g fill="#f4ede0" fill-opacity="0.26">
		<rect x="26" y="12" width="12" height="12" rx="2.5"/>
		<rect x="12" y="26" width="12" height="12" rx="2.5"/>
		<rect x="40" y="26" width="12" height="12" rx="2.5"/>
		<rect x="26" y="40" width="12" height="12" rx="2.5"/>
		<rect x="40" y="40" width="12" height="12" rx="2.5"/>
	</g>
</svg>
